[metadata]
name = "SearchMyComputer Benchmark Suite"
version = "1.0.0"
description = "Evaluation benchmark suite across exact-name, keyword, semantic, and mixed queries."

# -----------------------------------------------------------------------------
# Category 1: exact-name queries (~15 queries)
# -----------------------------------------------------------------------------

[[query]]
id = "exact-01"
query = "architecture.txt"
query_type = "exact-name"
expected_files = ["engineering/architecture.txt"]
description = "Exact filename match for system architecture overview"

[[query]]
id = "exact-02"
query = "vector_index.rs"
query_type = "exact-name"
expected_files = ["code/vector_index.rs"]
description = "Exact filename match for vector index source"

[[query]]
id = "exact-03"
query = "payment_gateway.ts"
query_type = "exact-name"
expected_files = ["code/payment_gateway.ts"]
description = "Exact filename match for TypeScript payment gateway service"

[[query]]
id = "exact-04"
query = "model_quantization.py"
query_type = "exact-name"
expected_files = ["code/model_quantization.py"]
description = "Exact Python script name for ONNX model quantization"

[[query]]
id = "exact-05"
query = "q3_financial_report_2024.pdf"
query_type = "exact-name"
expected_files = ["finance/q3_financial_report_2024.pdf"]
description = "Exact PDF report filename"

[[query]]
id = "exact-06"
query = "soc2_compliance_report.pdf"
query_type = "exact-name"
expected_files = ["legal_compliance/soc2_compliance_report.pdf"]
description = "Exact SOC2 compliance report PDF"

[[query]]
id = "exact-07"
query = "budget_allocation_q4_2024.docx"
query_type = "exact-name"
expected_files = ["finance/budget_allocation_q4_2024.docx"]
description = "Exact DOCX budget allocation document"

[[query]]
id = "exact-08"
query = "kubernetes_production_cluster.yaml"
query_type = "exact-name"
expected_files = ["infrastructure_ops/kubernetes_production_cluster.yaml"]
description = "Exact K8s manifest filename"

[[query]]
id = "exact-09"
query = "terraform_aws_infrastructure.tf"
query_type = "exact-name"
expected_files = ["infrastructure_ops/terraform_aws_infrastructure.tf"]
description = "Exact Terraform configuration file"

[[query]]
id = "exact-10"
query = "product_roadmap_2025_vision.pptx"
query_type = "exact-name"
expected_files = ["product_design/product_roadmap_2025_vision.pptx"]
description = "Exact PPTX presentation roadmap filename"

[[query]]
id = "exact-11"
query = "executive_compensation_salary_bands.xlsx"
query_type = "exact-name"
expected_files = ["finance/executive_compensation_salary_bands.xlsx"]
description = "Exact Excel salary bands spreadsheet"

[[query]]
id = "exact-12"
query = "fast_matrix_multiply.cpp"
query_type = "exact-name"
expected_files = ["code/fast_matrix_multiply.cpp"]
description = "Exact C++ AVX2 kernel source"

[[query]]
id = "exact-13"
query = "grpc_server.go"
query_type = "exact-name"
expected_files = ["code/grpc_server.go"]
description = "Exact Go gRPC server source"

[[query]]
id = "exact-14"
query = "schema_migrations.sql"
query_type = "exact-name"
expected_files = ["code/schema_migrations.sql"]
description = "Exact SQL schema migrations file"

[[query]]
id = "exact-15"
query = "gdpr_data_retention_policy.docx"
query_type = "exact-name"
expected_files = ["legal_compliance/gdpr_data_retention_policy.docx"]
description = "Exact GDPR policy document filename"

