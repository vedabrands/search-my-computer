<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="pillGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillShellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0f1017"/>
    </linearGradient>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <rect width="960" height="620" fill="url(#pillGlow)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="700">Chunk 12: Floating Status Pill Shell</text>
    <text x="0" y="22" fill="#94a3b8" font-size="13">Always-on-top, frameless, 240×44px micro status pill docked to screen corner. Expands on hotkey, click, or wake-word.</text>
  </g>

  <!-- Section 1: Visual State Matrix -->
  <g transform="translate(60, 100)">
    <text x="0" y="0" fill="#60a5fa" font-size="12" font-weight="600" letter-spacing="0.5">DYNAMIC VISUAL STATES (240×44px)</text>

    <!-- State 1: Idle -->
    <g transform="translate(0, 20)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="url(#pillShellBg)" stroke="#262938" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="4.5" fill="#10b981"/>
      <text x="36" y="27" fill="#f1f5f9" font-size="12" font-weight="500">1,428 files</text>
      <text x="160" y="27" font-size="12">🎙️</text>
      <rect x="180" y="12" width="50" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="205" y="26" fill="#94a3b8" font-size="9.5" font-family="monospace" text-anchor="middle">Alt+Space</text>
      <text x="255" y="27" fill="#64748b" font-size="11">Idle (Ready for query)</text>
    </g>

    <!-- State 2: Listening -->
    <g transform="translate(0, 80)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="#151d30" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="5" fill="#3b82f6"/>
      <!-- Voice Viz Bars -->
      <rect x="36" y="16" width="3" height="12" rx="1.5" fill="#60a5fa"/>
      <rect x="42" y="12" width="3" height="20" rx="1.5" fill="#60a5fa"/>
      <rect x="48" y="15" width="3" height="14" rx="1.5" fill="#60a5fa"/>
      <text x="58" y="27" fill="#93c5fd" font-size="12" font-weight="600">Listening...</text>
      <rect x="154" y="10" width="24" height="24" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
      <text x="160" y="26" font-size="12">🎙️</text>
      <rect x="184" y="12" width="46" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="207" y="26" fill="#94a3b8" font-size="9.5" font-family="monospace" text-anchor="middle">Enter</text>
      <text x="255" y="27" fill="#64748b" font-size="11">Listening (Audio Level &amp; Viz)</text>
    </g>

    <!-- State 3: Searching / Transcribing -->
    <g transform="translate(0, 140)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="#171926" stroke="#6366f1" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="4.5" fill="#6366f1"/>
      <text x="36" y="27" fill="#c7d2fe" font-size="12" font-weight="500">Searching...</text>
      <text x="160" y="27" font-size="12">🎙️</text>
      <rect x="180" y="12" width="50" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="205" y="26" fill="#94a3b8" font-size="9.5" font-family="monospace" text-anchor="middle">Alt+Space</text>
      <text x="255" y="27" fill="#64748b" font-size="11">Searching / Transcribing</text>
    </g>

    <!-- State 4: Results -->
    <g transform="translate(0, 200)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="#131c26" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="4.5" fill="#06b6d4"/>
      <text x="36" y="27" fill="#a5f3fc" font-size="12" font-weight="500">12 results</text>
      <text x="160" y="27" font-size="12">🎙️</text>
      <rect x="180" y="12" width="50" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="205" y="26" fill="#94a3b8" font-size="9.5" font-family="monospace" text-anchor="middle">Alt+Space</text>
      <text x="255" y="27" fill="#64748b" font-size="11">Results Available</text>
    </g>

    <!-- State 5: Indexing in Background -->
    <g transform="translate(0, 260)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="#211b15" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="4.5" fill="#f59e0b"/>
      <text x="36" y="27" fill="#fde68a" font-size="12" font-weight="500">Indexing (42)</text>
      <text x="160" y="27" font-size="12">🎙️</text>
      <rect x="180" y="12" width="50" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="205" y="26" fill="#94a3b8" font-size="9.5" font-family="monospace" text-anchor="middle">Alt+Space</text>
      <text x="255" y="27" fill="#64748b" font-size="11">Indexing in background</text>
    </g>

    <!-- State 6: Paused -->
    <g transform="translate(0, 320)" filter="url(#pillShadow)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="#15161c" stroke="#475569" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="4.5" fill="#64748b"/>
      <text x="36" y="27" fill="#94a3b8" font-size="12" font-weight="500">Paused</text>
      <text x="160" y="27" font-size="12">🎙️</text>
      <rect x="180" y="12" width="50" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="205" y="26" fill="#94a3b8" font-size="9.5" font-family="monospace" text-anchor="middle">Alt+Space</text>
      <text x="255" y="27" fill="#64748b" font-size="11">Paused (Battery / User toggle)</text>
    </g>
  </g>

  <!-- Section 2: Corner Docking & Growth Geometry Diagram -->
  <g transform="translate(540, 100)">
    <text x="0" y="0" fill="#60a5fa" font-size="12" font-weight="600" letter-spacing="0.5">CORNER DOCKING &amp; GROWTH VECTORS</text>

    <!-- Monitor Wireframe -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="360" height="230" rx="8" fill="#111219" stroke="#334155" stroke-width="2"/>
      <!-- Taskbar representation -->
      <rect x="0" y="206" width="360" height="24" fill="#0c0d12" stroke="#1e293b" stroke-width="1"/>
      <circle cx="16" cy="218" r="4" fill="#3b82f6"/>
      <rect x="28" y="214" width="40" height="8" rx="2" fill="#1e293b"/>

      <!-- Docking Position: Top-Left -->
      <rect x="12" y="12" width="70" height="18" rx="9" fill="#181a24" stroke="#475569" stroke-width="1"/>
      <text x="47" y="24" fill="#94a3b8" font-size="8" text-anchor="middle">Top-Left ↘</text>

      <!-- Docking Position: Top-Right -->
      <rect x="278" y="12" width="70" height="18" rx="9" fill="#181a24" stroke="#475569" stroke-width="1"/>
      <text x="313" y="24" fill="#94a3b8" font-size="8" text-anchor="middle">↙ Top-Right</text>

      <!-- Docking Position: Bottom-Left -->
      <rect x="12" y="176" width="70" height="18" rx="9" fill="#181a24" stroke="#475569" stroke-width="1"/>
      <text x="47" y="188" fill="#94a3b8" font-size="8" text-anchor="middle">Bottom-Left ↗</text>

      <!-- Expanded Search Panel (Growing from Bottom-Right) -->
      <rect x="145" y="46" width="203" height="148" rx="8" fill="#181a24" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="246" y="120" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Expanded Panel (680×500px)</text>
      <text x="246" y="136" fill="#64748b" font-size="8.5" text-anchor="middle">Grows up and left from pill</text>

      <!-- Docking Position: Bottom-Right (Active Default) -->
      <rect x="268" y="176" width="80" height="20" rx="10" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5"/>
      <circle cx="278" cy="186" r="3" fill="#ffffff"/>
      <text x="312" y="189" fill="#ffffff" font-size="8.5" font-weight="600" text-anchor="middle">Bottom-Right ↖</text>

      <!-- Arrow indicating expansion direction -->
      <path d="M 300 170 L 250 120" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2,2"/>
      <polygon points="248,124 246,116 254,118" fill="#60a5fa"/>
    </g>

    <!-- Key Technical Highlights Box -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="360" height="94" rx="8" fill="#13151f" stroke="#262938" stroke-width="1"/>
      <text x="14" y="22" fill="#f8fafc" font-size="11.5" font-weight="600">Dynamic Multi-Monitor &amp; Boundary Clamping</text>
      <text x="14" y="40" fill="#94a3b8" font-size="10">• Clamps to active monitor work area (avoids taskbar overlap)</text>
      <text x="14" y="56" fill="#94a3b8" font-size="10">• Drag-to-reposition across displays persists in AppConfig</text>
      <text x="14" y="72" fill="#94a3b8" font-size="10">• Focus blur / Esc smoothly collapses back to status pill</text>
    </g>
  </g>
</svg>