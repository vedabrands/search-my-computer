<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" style="background:transparent; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="settShadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="modalBg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141620"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
  </defs>

  <g filter="url(#settShadow7)">
    <!-- Main Modal Window -->
    <rect x="20" y="20" width="880" height="600" rx="14" fill="url(#modalBg7)" stroke="#262938" stroke-width="1.5"/>

    <!-- Header Title & Close Button -->
    <g transform="translate(48, 45)">
      <text x="0" y="0" fill="#f8fafc" font-size="20" font-weight="700">Settings</text>
      <text x="0" y="20" fill="#94a3b8" font-size="12">Configure indexing folders, exclusions, performance governor, and privacy defaults.</text>
      <rect x="800" y="-15" width="28" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="814" y="4" fill="#94a3b8" font-size="13" text-anchor="middle">✕</text>
    </g>

    <!-- 6 Tabs Navigation Bar -->
    <g transform="translate(48, 85)">
      <!-- Tab 1: General -->
      <rect x="0" y="0" width="95" height="32" rx="6" fill="#13151f"/>
      <text x="47" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">General</text>

      <!-- Tab 2: Folders (Active) -->
      <rect x="105" y="0" width="95" height="32" rx="6" fill="#2563eb"/>
      <text x="152" y="20" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Folders</text>

      <!-- Tab 3: File Types -->
      <rect x="210" y="0" width="95" height="32" rx="6" fill="#13151f"/>
      <text x="257" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">File Types</text>

      <!-- Tab 4: Performance -->
      <rect x="315" y="0" width="115" height="32" rx="6" fill="#13151f"/>
      <text x="372" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Performance</text>

      <!-- Tab 5: Health -->
      <rect x="440" y="0" width="85" height="32" rx="6" fill="#13151f"/>
      <text x="482" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Health</text>

      <!-- Tab 6: Privacy -->
      <rect x="535" y="0" width="85" height="32" rx="6" fill="#13151f"/>
      <text x="577" y="20" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Privacy</text>
    </g>

    <line x1="48" y1="130" x2="872" y2="130" stroke="#222533" stroke-width="1"/>

    <!-- Tab Content: Folders & Exclusions -->
    <g transform="translate(48, 145)">
      <!-- Left Column: Indexed Folders List -->
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#f8fafc" font-size="14" font-weight="600">Indexed Folders</text>
        <text x="0" y="32" fill="#94a3b8" font-size="11">Folders monitored for real-time changes and indexing.</text>

        <!-- Folder Row 1 -->
        <g transform="translate(0, 44)">
          <rect x="0" y="0" width="390" height="42" rx="6" fill="#161824" stroke="#262938" stroke-width="1"/>
          <text x="14" y="26" fill="#60a5fa" font-size="14">📁</text>
          <text x="38" y="26" fill="#f1f5f9" font-size="12" font-weight="500">C:\Users\dev\Documents</text>
          <text x="370" y="26" fill="#ef4444" font-size="12" text-anchor="end" cursor="pointer">✕</text>
        </g>

        <!-- Folder Row 2 -->
        <g transform="translate(0, 94)">
          <rect x="0" y="0" width="390" height="42" rx="6" fill="#161824" stroke="#262938" stroke-width="1"/>
          <text x="14" y="26" fill="#60a5fa" font-size="14">📁</text>
          <text x="38" y="26" fill="#f1f5f9" font-size="12" font-weight="500">C:\Users\dev\Downloads</text>
          <text x="370" y="26" fill="#ef4444" font-size="12" text-anchor="end" cursor="pointer">✕</text>
        </g>

        <!-- Folder Row 3 -->
        <g transform="translate(0, 144)">
          <rect x="0" y="0" width="390" height="42" rx="6" fill="#161824" stroke="#262938" stroke-width="1"/>
          <text x="14" y="26" fill="#60a5fa" font-size="14">📁</text>
          <text x="38" y="26" fill="#f1f5f9" font-size="12" font-weight="500">C:\Users\dev\Projects</text>
          <text x="370" y="26" fill="#ef4444" font-size="12" text-anchor="end" cursor="pointer">✕</text>
        </g>

        <!-- Add Folder Button -->
        <g transform="translate(0, 200)">
          <rect x="0" y="0" width="390" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
          <text x="195" y="22" fill="#93c5fd" font-size="12" font-weight="600" text-anchor="middle">+ Add Folder to Index</text>
        </g>
      </g>

      <!-- Right Column: Exclusions & Live Glob Tester -->
      <g transform="translate(424, 0)">
        <text x="0" y="14" fill="#f8fafc" font-size="14" font-weight="600">Exclusion Patterns &amp; Glob Tester</text>
        <text x="0" y="32" fill="#94a3b8" font-size="11">Default &amp; custom glob patterns skipped during file tree walk.</text>

        <!-- Exclusion Tags Box -->
        <g transform="translate(0, 44)">
          <rect x="0" y="0" width="400" height="110" rx="8" fill="#10121a" stroke="#222533" stroke-width="1"/>

          <!-- Tag 1 -->
          <rect x="12" y="12" width="105" height="24" rx="4" fill="#1e293b"/>
          <text x="22" y="28" fill="#e2e8f0" font-size="11" font-family="monospace">node_modules</text>

          <!-- Tag 2 -->
          <rect x="125" y="12" width="55" height="24" rx="4" fill="#1e293b"/>
          <text x="135" y="28" fill="#e2e8f0" font-size="11" font-family="monospace">.git</text>

          <!-- Tag 3 -->
          <rect x="188" y="12" width="70" height="24" rx="4" fill="#1e293b"/>
          <text x="198" y="28" fill="#e2e8f0" font-size="11" font-family="monospace">*.tmp</text>

          <!-- Tag 4 -->
          <rect x="266" y="12" width="65" height="24" rx="4" fill="#1e293b"/>
          <text x="276" y="28" fill="#e2e8f0" font-size="11" font-family="monospace">target</text>

          <!-- Tag 5 -->
          <rect x="12" y="44" width="75" height="24" rx="4" fill="#1e293b"/>
          <text x="22" y="60" fill="#e2e8f0" font-size="11" font-family="monospace">.cache</text>

          <!-- Tag 6 -->
          <rect x="95" y="44" width="75" height="24" rx="4" fill="#1e293b"/>
          <text x="105" y="60" fill="#e2e8f0" font-size="11" font-family="monospace">.venv</text>

          <!-- Tag 7 -->
          <rect x="178" y="44" width="85" height="24" rx="4" fill="#1e293b"/>
          <text x="188" y="60" fill="#e2e8f0" font-size="11" font-family="monospace">__pycache__</text>
        </g>

        <!-- Live Glob Tester Card -->
        <g transform="translate(0, 168)">
          <rect x="0" y="0" width="400" height="185" rx="8" fill="#13151f" stroke="#262938" stroke-width="1"/>
          <text x="14" y="22" fill="#93c5fd" font-size="12" font-weight="600">🧪 Live Exclusion Glob Tester</text>

          <!-- Input 1: Pattern -->
          <text x="14" y="46" fill="#94a3b8" font-size="11">Glob Pattern:</text>
          <rect x="14" y="54" width="372" height="30" rx="4" fill="#0d0e14" stroke="#262938" stroke-width="1"/>
          <text x="24" y="74" fill="#f8fafc" font-size="11" font-family="monospace">**/*.log</text>

          <!-- Input 2: Path -->
          <text x="14" y="102" fill="#94a3b8" font-size="11">Test File Path:</text>
          <rect x="14" y="110" width="280" height="30" rx="4" fill="#0d0e14" stroke="#262938" stroke-width="1"/>
          <text x="24" y="130" fill="#f8fafc" font-size="11" font-family="monospace">C:/app/logs/error.log</text>

          <!-- Test Button -->
          <rect x="302" y="110" width="84" height="30" rx="4" fill="#2563eb"/>
          <text x="344" y="130" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Test Match</text>

          <!-- Match Result Indicator -->
          <g transform="translate(14, 152)">
            <rect x="0" y="0" width="372" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
            <text x="10" y="16" fill="#6ee7b7" font-size="11" font-weight="600">✓ Pattern MATCHES — File will be excluded from index</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Footer Controls -->
    <g transform="translate(48, 560)">
      <rect x="674" y="0" width="150" height="36" rx="6" fill="#2563eb"/>
      <text x="749" y="23" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Save Changes</text>
      <text x="0" y="23" fill="#64748b" font-size="12">Changes apply immediately to background file watcher and search ranking.</text>
    </g>
  </g>
</svg>
