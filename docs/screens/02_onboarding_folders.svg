<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="glow2" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#111219"/>
    </linearGradient>
    <linearGradient id="btnGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="680" fill="url(#glow2)"/>

  <!-- Stepper Header -->
  <g transform="translate(300, 30)">
    <circle cx="60" cy="20" r="14" fill="#10b981"/>
    <text x="60" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="60" y="48" fill="#10b981" font-size="11" text-anchor="middle">Welcome</text>

    <line x1="85" y1="20" x2="175" y2="20" stroke="#10b981" stroke-width="2"/>

    <circle cx="200" cy="20" r="14" fill="#3b82f6"/>
    <text x="200" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <text x="200" y="48" fill="#93c5fd" font-size="11" text-anchor="middle">Folders</text>

    <line x1="225" y1="20" x2="315" y2="20" stroke="#262938" stroke-width="2"/>

    <circle cx="340" cy="20" r="14" fill="#181a24" stroke="#262938" stroke-width="2"/>
    <text x="340" y="25" fill="#64748b" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <text x="340" y="48" fill="#64748b" font-size="11" text-anchor="middle">Ready</text>
  </g>

  <!-- Container Box -->
  <rect x="120" y="90" width="760" height="560" rx="16" fill="url(#cardGrad2)" stroke="#262938" stroke-width="1"/>

  <text x="500" y="130" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">Choose What to Index</text>
  <text x="500" y="152" fill="#94a3b8" font-size="13" text-anchor="middle">Select the folders you want to search. You can adjust exclusions anytime in Settings.</text>

  <!-- Folder Grid Checklist -->
  <g transform="translate(150, 175)">
    <!-- Folder Card 1 (Checked) -->
    <rect x="0" y="0" width="345" height="62" rx="8" fill="#161d2f" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="14" y="22" width="18" height="18" rx="4" fill="#3b82f6"/>
    <text x="23" y="35" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="44" y="28" fill="#f8fafc" font-size="13" font-weight="600">Documents</text>
    <text x="44" y="46" fill="#94a3b8" font-size="11">C:\Users\dev\Documents</text>

    <!-- Folder Card 2 (Checked) -->
    <rect x="355" y="0" width="345" height="62" rx="8" fill="#161d2f" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="369" y="22" width="18" height="18" rx="4" fill="#3b82f6"/>
    <text x="378" y="35" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="399" y="28" fill="#f8fafc" font-size="13" font-weight="600">Downloads</text>
    <text x="399" y="46" fill="#94a3b8" font-size="11">C:\Users\dev\Downloads</text>

    <!-- Folder Card 3 (Checked - Projects) -->
    <rect x="0" y="72" width="345" height="62" rx="8" fill="#161d2f" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="14" y="94" width="18" height="18" rx="4" fill="#3b82f6"/>
    <text x="23" y="107" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="44" y="100" fill="#f8fafc" font-size="13" font-weight="600">Projects &amp; Code</text>
    <rect x="150" y="87" width="92" height="18" rx="4" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
    <text x="196" y="100" fill="#c4b5fd" font-size="10" font-weight="600" text-anchor="middle">Code &amp; Git</text>
    <text x="44" y="118" fill="#94a3b8" font-size="11">C:\Users\dev\Projects</text>

    <!-- Folder Card 4 (Unchecked - Pictures) -->
    <rect x="355" y="72" width="345" height="62" rx="8" fill="#13151f" stroke="#262938" stroke-width="1"/>
    <rect x="369" y="94" width="18" height="18" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="399" y="100" fill="#f8fafc" font-size="13" font-weight="600">Pictures &amp; Photos</text>
    <rect x="525" y="87" width="60" height="18" rx="4" fill="#451a03" stroke="#d97706" stroke-width="1"/>
    <text x="555" y="100" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">Media</text>
    <text x="399" y="118" fill="#64748b" font-size="11">C:\Users\dev\Pictures</text>
  </g>

  <!-- Custom Folder Input -->
  <g transform="translate(150, 330)">
    <rect x="0" y="0" width="600" height="38" rx="6" fill="#0d0e14" stroke="#262938" stroke-width="1"/>
    <text x="15" y="24" fill="#64748b" font-size="12">Or enter custom folder path (e.g. D:/Work, C:/Data)...</text>
    <rect x="610" y="0" width="90" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="655" y="24" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">+ Add</text>
  </g>

  <!-- Options Toggles -->
  <g transform="translate(150, 395)">
    <text x="0" y="15" fill="#e2e8f0" font-size="13" font-weight="600">Optional Enhancements</text>

    <!-- Option 1 -->
    <rect x="0" y="30" width="700" height="52" rx="8" fill="#13151f" stroke="#262938" stroke-width="1"/>
    <rect x="18" y="47" width="36" height="18" rx="9" fill="#1e293b"/>
    <circle cx="27" cy="56" r="7" fill="#64748b"/>
    <text x="65" y="52" fill="#f8fafc" font-size="13" font-weight="600">Image &amp; Multimodal Indexing</text>
    <text x="65" y="68" fill="#94a3b8" font-size="11">Extract OCR text and scan QR codes in images locally using CPU.</text>

    <!-- Option 2 -->
    <rect x="0" y="90" width="700" height="52" rx="8" fill="#13151f" stroke="#262938" stroke-width="1"/>
    <rect x="18" y="107" width="36" height="18" rx="9" fill="#3b82f6"/>
    <circle cx="45" cy="116" r="7" fill="#ffffff"/>
    <text x="65" y="112" fill="#f8fafc" font-size="13" font-weight="600">Launch at System Login</text>
    <text x="65" y="128" fill="#94a3b8" font-size="11">Start SearchMyComputer in the background when you turn on your PC.</text>
  </g>

  <!-- Actions -->
  <g transform="translate(150, 580)">
    <rect x="0" y="0" width="110" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="55" y="26" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">← Back</text>

    <rect x="420" y="0" width="280" height="42" rx="8" fill="url(#btnGrad2)"/>
    <text x="560" y="26" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Confirm &amp; Start Indexing (3 folders) →</text>
  </g>
</svg>
