<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background:#090a0f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="glow3" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#111219"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="btnGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="680" fill="url(#glow3)"/>

  <!-- Stepper Header -->
  <g transform="translate(300, 30)">
    <circle cx="60" cy="20" r="14" fill="#10b981"/>
    <text x="60" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="60" y="48" fill="#10b981" font-size="11" text-anchor="middle">Welcome</text>

    <line x1="85" y1="20" x2="175" y2="20" stroke="#10b981" stroke-width="2"/>

    <circle cx="200" cy="20" r="14" fill="#10b981"/>
    <text x="200" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
    <text x="200" y="48" fill="#10b981" font-size="11" text-anchor="middle">Folders</text>

    <line x1="225" y1="20" x2="315" y2="20" stroke="#10b981" stroke-width="2"/>

    <circle cx="340" cy="20" r="14" fill="#3b82f6"/>
    <text x="340" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <text x="340" y="48" fill="#93c5fd" font-size="11" text-anchor="middle">Ready</text>
  </g>

  <!-- Container Box -->
  <rect x="140" y="90" width="720" height="560" rx="16" fill="url(#cardGrad3)" stroke="#262938" stroke-width="1"/>

  <!-- Title & Status -->
  <text x="500" y="145" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">Indexing Your Files</text>
  <text x="500" y="172" fill="#94a3b8" font-size="13" text-anchor="middle">Building your local inverted index and semantic vectors. You can start searching right away.</text>

  <!-- Progress Bar Container -->
  <g transform="translate(180, 205)">
    <rect x="0" y="0" width="640" height="12" rx="6" fill="#1e293b"/>
    <rect x="0" y="0" width="480" height="12" rx="6" fill="url(#progressGrad)"/>
    <text x="0" y="32" fill="#94a3b8" font-size="12">Processing: <tspan fill="#e2e8f0" font-family="monospace">C:/Users/dev/Projects/src/engine.rs</tspan></text>
    <text x="640" y="32" fill="#10b981" font-size="12" font-weight="600" text-anchor="end">75% Complete</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(180, 275)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="195" height="85" rx="10" fill="#13151f" stroke="#262938" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-size="12">Files Discovered</text>
    <text x="20" y="65" fill="#f8fafc" font-size="24" font-weight="700">1,428</text>

    <!-- Metric 2 -->
    <rect x="222" y="0" width="195" height="85" rx="10" fill="#13151f" stroke="#262938" stroke-width="1"/>
    <text x="242" y="32" fill="#94a3b8" font-size="12">Indexed &amp; Embedded</text>
    <text x="242" y="65" fill="#10b981" font-size="24" font-weight="700">1,071</text>

    <!-- Metric 3 -->
    <rect x="445" y="0" width="195" height="85" rx="10" fill="#13151f" stroke="#262938" stroke-width="1"/>
    <text x="465" y="32" fill="#94a3b8" font-size="12">Embedding Model</text>
    <text x="465" y="62" fill="#60a5fa" font-size="15" font-weight="600">bge-small-en-v1.5</text>
    <text x="465" y="78" fill="#94a3b8" font-size="11">int8 CPU ONNX (384d)</text>
  </g>

  <!-- Hotkey Tip Card -->
  <g transform="translate(180, 385)">
    <rect x="0" y="0" width="640" height="120" rx="12" fill="#161d2f" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="30" y="38" fill="#93c5fd" font-size="14" font-weight="600">💡 Quick Launch Hotkey</text>
    <text x="30" y="65" fill="#e2e8f0" font-size="13">Press <tspan font-family="monospace" font-weight="bold" fill="#ffffff" fill-opacity="0.95">Alt + Space</tspan> anywhere to summon the launcher instantly.</text>
    <text x="30" y="92" fill="#94a3b8" font-size="12">Background indexing continues silently and automatically throttles on battery.</text>
  </g>

  <!-- Bottom Actions -->
  <g transform="translate(180, 560)">
    <rect x="0" y="0" width="640" height="46" rx="8" fill="url(#btnGrad3)"/>
    <text x="320" y="28" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Start Searching Now (Alt+Space) →</text>
  </g>
</svg>
