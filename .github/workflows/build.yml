name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Fetch Bundled ONNX Models
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/fetch_models.ps1

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchMyComputer-NSIS-Installer
          path: |
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SearchMyComputer-MSI-Installer
          path: |
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
